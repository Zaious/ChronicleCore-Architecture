  <rect x="40" y="264.3" width="910.2109999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="278.3" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Tailscale private network · every link peer-to-peer</text>
