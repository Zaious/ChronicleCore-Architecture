  <rect x="40" y="251.3" width="891.686" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="265.3" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Tailscale 私網(WireGuard)· 節點之間全部點對點直連</text>
